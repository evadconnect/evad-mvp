<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EVAD — Deva t'accueille</title>
  <link rel="icon" href="img/evad-logo.png">
  <style>
    :root {
      --ink:      #14251d;
      --forest:   #14432e;   /* vert foncé (en-tête) */
      --green:    #2f8f57;   /* vert moyen (étapes) */
      --green-d:  #256f45;
      --gold:     #f0b429;   /* jaune (question / preuve) */
      --gold-d:   #c8931a;
      --paper:    #ffffff;
      --cream:    #eef4ef;   /* fond doux */
      --line:     rgba(20,67,46,.14);
      --shadow:   0 18px 40px -18px rgba(20,67,46,.45);
      --r:        18px;
      --r-lg:     26px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ── En-tête ── */
    header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .9rem 1.1rem;
      background: var(--forest);
      color: #fff;
    }
    header img { height: 30px; width: auto; display: block; }
    header .brand { font-weight: 700; letter-spacing: .04em; font-size: 1.05rem; }
    header .brand small { display: block; font-weight: 500; font-size: .62rem; opacity: .7; letter-spacing: .02em; }

    /* ── Zone conversation ── */
    main {
      width: 100%;
      max-width: 560px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.1rem 1rem 1.4rem;
    }
    .chat { flex: 1; display: flex; flex-direction: column; gap: .85rem; }

    /* bulles */
    .row { display: flex; gap: .55rem; align-items: flex-end; animation: rise .32s ease both; }
    .row.deva { align-self: flex-start; max-width: 88%; }
    .row.me   { align-self: flex-end; flex-direction: row-reverse; max-width: 82%; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .avatar {
      flex: none; width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; background: var(--green); border: 2px solid #fff;
      box-shadow: 0 4px 10px -4px rgba(20,67,46,.5);
    }
    .bubble {
      padding: .8rem 1rem; border-radius: var(--r); font-size: 1.02rem; line-height: 1.45;
    }
    .deva .bubble { background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: 0 6px 18px -12px rgba(20,67,46,.4); }
    .me   .bubble { background: var(--green); color: #fff; border-bottom-right-radius: 6px; }
    .bubble strong { color: var(--green-d); }
    .me .bubble strong { color: #fff; }

    /* indicateur "Deva écrit…" */
    .typing { display: inline-flex; gap: 5px; padding: .2rem 0; }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--green); opacity: .5; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    /* ── Zone d'actions (boutons / saisie) ── */
    .actions {
      margin-top: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      animation: rise .3s ease both;
    }
    .actions.hidden { display: none; }

    .btn {
      font-family: inherit; font-size: 1.02rem; font-weight: 650;
      padding: .95rem 1.1rem; border-radius: var(--r);
      border: 2px solid transparent; cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: .7rem; width: 100%;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn .ico { font-size: 1.3rem; flex: none; }
    .btn .sub { display: block; font-weight: 500; font-size: .78rem; opacity: .72; margin-top: .1rem; }

    .btn-primary { background: var(--green); color: #fff; box-shadow: 0 10px 22px -12px rgba(47,143,87,.9); }
    .btn-primary:hover { background: var(--green-d); }
    .btn-gold { background: var(--gold); color: var(--ink); box-shadow: 0 10px 22px -12px rgba(240,180,41,.9); }
    .btn-gold:hover { background: var(--gold-d); }
    .btn-ghost { background: var(--paper); color: var(--forest); border-color: var(--line); }
    .btn-ghost:hover { border-color: var(--green); }

    /* saisie prénom */
    .field { display: flex; gap: .5rem; }
    .field input {
      flex: 1; font-family: inherit; font-size: 1.05rem; padding: .9rem 1rem;
      border: 2px solid var(--line); border-radius: var(--r); background: #fff; color: var(--ink);
    }
    .field input:focus { outline: none; border-color: var(--green); }
    .field .send {
      flex: none; border: none; background: var(--green); color: #fff; border-radius: var(--r);
      width: 54px; font-size: 1.3rem; cursor: pointer;
    }
    .field .send:hover { background: var(--green-d); }

    /* carte vidéo Vision */
    .video-card {
      background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg);
      overflow: hidden; box-shadow: var(--shadow); animation: rise .32s ease both;
    }
    .video-frame {
      aspect-ratio: 16 / 9; background: linear-gradient(135deg, var(--forest), var(--green));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; gap: .5rem; text-align: center; padding: 1rem;
    }
    .video-frame .play { width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .video-frame small { opacity: .8; font-size: .74rem; max-width: 80%; }
    .video-card .cap { padding: .75rem 1rem; font-size: .82rem; color: var(--ink); opacity: .75; }

    /* écran destination (stub) */
    .dest {
      background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 1.3rem; box-shadow: var(--shadow); animation: rise .32s ease both;
    }
    .dest h2 { margin: 0 0 .4rem; font-size: 1.25rem; color: var(--forest); }
    .dest p { margin: 0 0 1rem; line-height: 1.5; }
    .pipeline { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1.1rem; }
    .pipeline .step {
      font-size: .74rem; font-weight: 650; padding: .4rem .7rem; border-radius: 100px;
      background: var(--cream); color: var(--green-d); border: 1px solid var(--line);
    }
    .pipeline .step.on { background: var(--green); color: #fff; border-color: var(--green); }
    .pipeline .step.proof { }
    .pipeline .step.proof.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }

    .muted { text-align: center; font-size: .74rem; color: var(--ink); opacity: .5; padding-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <img src="img/evad-logo.png" alt="EVAD">
    <span class="brand">EVAD<small>Écosystème Vivant d'Action et de Développement</small></span>
  </header>

  <main>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="actions hidden" id="actions"></div>
    <p class="muted" id="footnote"></p>
  </main>

  <script src="js/deva-onboarding.js"></script>
</body>
</html>
