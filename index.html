<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EVAD — Deva</title>
  <link rel="icon" href="img/evad-logo.png">
  <style>
    /* ═══ Palette forêt & or ═══ */
    :root {
      --ink:    #14251d;
      --forest: #14432e;
      --moss:   #256f45;
      --fern:   #2f8f57;
      --gold:   #f0b429;
      --cream:  #eef4ef;
      --paper:  #ffffff;
      --line:   rgba(20,67,46,.14);
      --shadow: 0 18px 40px -18px rgba(20,67,46,.45);
      --font:   -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --accent: var(--forest);   /* teinte d'ambiance, selon le contexte */
    }
    [data-mode="accueil"]  { --accent: #256f45; }
    [data-mode="esquisse"] { --accent: #2f8f57; }
    [data-mode="commun"]   { --accent: #c8732a; }
    [data-mode="gestion"]  { --accent: #1f8f5f; }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font); color: var(--ink);
      background: radial-gradient(120% 80% at 50% 0%, #f4f8f3 0%, var(--cream) 60%);
      height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased;
    }

    /* ═══ La surface : une colonne (accueil), deux colonnes (outil) ═══
       La bascule anime la largeur des colonnes : Deva "fait de la place". */
    .surface { display: grid; grid-template-columns: 1fr 0fr; height: 100dvh;
      transition: grid-template-columns .6s cubic-bezier(.4,0,.2,1); }
    [data-phase="outil"] .surface { grid-template-columns: minmax(320px, 380px) 1fr; }

    /* ─── Deva : le panneau conversation ─── */
    .deva-panel { display: flex; flex-direction: column; min-width: 0; overflow: hidden;
      max-width: 640px; margin: 0 auto; width: 100%; }
    [data-phase="outil"] .deva-panel { max-width: none; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--cream) 40%, #fff); }

    .deva-head { display: flex; align-items: center; gap: .6rem; padding: .8rem 1.1rem .5rem; }
    .deva-head img.logo { height: 24px; }
    .deva-head .name { font-weight: 700; letter-spacing: .04em; color: var(--forest); font-size: .95rem; }
    .deva-head .back { border: 1px solid var(--line); background: #fff; color: var(--moss); font-family: inherit;
      font-size: .72rem; font-weight: 700; border-radius: 100px; padding: .3rem .7rem; cursor: pointer; display: none; }
    .deva-head .back:hover { border-color: var(--fern); }
    [data-phase="outil"] .deva-head .back { display: inline-block; }
    .deva-head .mode-dot { margin-left: auto; display: inline-flex; align-items: center; gap: .4rem; font-size: .7rem; font-weight: 700; color: var(--moss); }
    .deva-head .mode-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

    .thread { flex: 1; overflow-y: auto; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .85rem; }
    .row { display: flex; gap: .55rem; align-items: flex-end; animation: rise .3s ease both; }
    .row.deva { align-self: flex-start; max-width: 92%; }
    .row.me   { align-self: flex-end; flex-direction: row-reverse; max-width: 88%; }
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      background: var(--fern); border: 2px solid #fff; box-shadow: 0 4px 10px -4px rgba(20,67,46,.5); }
    .bubble { padding: .8rem 1rem; border-radius: 18px; font-size: 1.02rem; line-height: 1.45; }
    .deva .bubble { background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: 0 6px 18px -13px rgba(20,67,46,.4); }
    .me   .bubble { background: var(--fern); color: #fff; border-bottom-right-radius: 6px; }
    .bubble strong { color: var(--moss); }
    .me .bubble strong { color: #fff; }
    .typing { display: inline-flex; gap: 5px; padding: .2rem 0; }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--fern); opacity: .5; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    .video-card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
    .video-frame { aspect-ratio: 16/9; background: linear-gradient(135deg, var(--forest), var(--fern)); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; gap: .4rem; text-align: center; padding: 1rem; }
    .video-frame .play { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .video-frame small { opacity: .82; font-size: .72rem; max-width: 82%; }
    .video-card .cap { padding: .7rem 1rem; font-size: .82rem; opacity: .78; }

    .composer { padding: .7rem 1.1rem calc(.9rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: .55rem; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--cream) 55%, #fff); }
    .composer.hidden { display: none; }
    .chips { display: flex; flex-direction: column; gap: .5rem; }
    .btn { font-family: inherit; font-size: 1rem; font-weight: 650; padding: .9rem 1rem; border-radius: 16px;
      border: 2px solid transparent; cursor: pointer; text-align: left; display: flex; align-items: center; gap: .65rem; width: 100%;
      transition: transform .12s ease, background .12s ease, border-color .12s; }
    .btn:active { transform: scale(.985); }
    .btn .ico { font-size: 1.25rem; flex: none; }
    .btn .sub { display: block; font-weight: 500; font-size: .76rem; opacity: .72; margin-top: .05rem; }
    .btn-primary { background: var(--fern); color: #fff; }
    .btn-primary:hover { background: var(--moss); }
    .btn-gold { background: var(--gold); color: var(--ink); }
    .btn-gold:hover { filter: brightness(.96); }
    .btn-ghost { background: var(--paper); color: var(--forest); border-color: var(--line); }
    .btn-ghost:hover { border-color: var(--fern); }
    .field { display: flex; gap: .5rem; }
    .field input { flex: 1; font-family: inherit; font-size: 1.05rem; padding: .85rem 1rem; border: 2px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); }
    .field input:focus { outline: none; border-color: var(--fern); }
    .field .send { flex: none; border: none; background: var(--fern); color: #fff; border-radius: 16px; width: 54px; font-size: 1.3rem; cursor: pointer; }
    .field .send:hover { background: var(--moss); }

    /* ═══ La fenêtre d'outil (à droite) ═══ */
    .tool-panel { min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
    .tool-head { display: flex; align-items: center; gap: .5rem; padding: .8rem 1.1rem; border-bottom: 1px solid var(--line); }
    .tool-head .t-accent { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); flex: none; }
    .tool-head .t-name { font-weight: 800; color: var(--forest); font-size: .95rem; }
    .tool-head .t-sub { font-size: .72rem; color: var(--moss); opacity: .7; margin-left: .3rem; }
    .tool-body { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 1.2rem; }
    .plateau-wrap { width: 100%; max-width: 520px; }

    /* ─── Le plateau (repris du jeu EVAD) ─── */
    .ter-wrap { position: relative; background: linear-gradient(180deg,#cfe6f4 0%,#e7f5ec 62%);
      border: 1px solid var(--line); border-radius: 26px; padding: 1.6rem .8rem 1.7rem;
      box-shadow: var(--shadow); perspective: 820px; perspective-origin: 50% 34%; overflow: hidden; }
    .ter-wrap::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); opacity: .5; }
    .ter-grid { --rot: 24deg; --zoom: 1; position: relative; display: grid;
      grid-template-columns: repeat(12,minmax(0,1fr)); gap: 2px; max-width: 352px; margin: 0 auto;
      transform: rotateX(54deg) rotateZ(var(--rot)) scale(var(--zoom)); transform-style: preserve-3d;
      transform-origin: 50% 62%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    .ter-grid::before { content: ''; position: absolute; inset: -8px; transform: translateZ(-14px); border-radius: 12px;
      background: linear-gradient(180deg,#b9d5ab,#9dbf90); box-shadow: 0 28px 36px -14px rgba(13,43,34,.5); }
    .ter-grid::after { content: ''; position: absolute; left: -8px; right: -8px; top: calc(100% + 8px); height: 16px;
      transform-origin: top; transform: rotateX(-90deg); border-radius: 0 0 12px 12px;
      background: linear-gradient(180deg,#8fae7e 0 3px,#a5814f 3px 55%,#7c5f38 55% 82%,#69543a 82%); }
    .ter-cell { position: relative; aspect-ratio: 1; border-radius: 2px; --h: 0px; --c: #bfd6b2; background: var(--c);
      transform: translateZ(var(--h)); transform-style: preserve-3d; box-shadow: inset 0 0 0 1px rgba(13,43,34,.05); transition: transform .14s, box-shadow .12s; }
    .ter-cell.alt { --c: #b5cea7; }
    .ter-cell.r1 { --h: 1.5px; }
    .ter-grid.live .ter-cell:hover { transform: translateZ(5px); box-shadow: inset 0 0 0 1px rgba(13,43,34,.28); }
    /* case posée : un bloc-voxel coloré par le type de l'espace */
    .ter-cell.fill { --h: 8px; --c: #cfd8d0; --cd: #b7c2b9; --cd2: #a6b2a8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 1px 0 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(20,67,46,.14); }
    .ter-cell.fill.flat { --h: 0px; box-shadow: inset 0 0 0 1px rgba(20,67,46,.14); }   /* jardin : au raz du sol */
    .ter-cell.fill::before { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: var(--h);
      transform-origin: top; transform: rotateX(-90deg); pointer-events: none; background: linear-gradient(0deg,var(--cd2),var(--cd) 70%); }
    .ter-cell.fill::after { content: ''; position: absolute; top: 0; bottom: 0; left: 100%; width: var(--h);
      transform-origin: left; transform: rotateY(90deg); pointer-events: none; background: var(--cd2); }
    /* case RÉALISÉE, en vert (arrive à l'étape 5) */
    .ter-cell.vert { --c: #69bf87; --cd: #4fae73; --cd2: #3f9a63; }
    /* décor posé sur l'herbe : chemins connectés, mare, éolienne */
    .ter-cell.deco-chemin { --c: #e8d7ab; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(13,43,34,.1), inset 0 -1px 0 rgba(255,255,255,.4); }
    .deco-chemin.chem-n { border-top-left-radius: 0; border-top-right-radius: 0; }
    .deco-chemin.chem-s { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .deco-chemin.chem-w { border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .deco-chemin.chem-e { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .deco-chemin.chem-e::before { content: ''; position: absolute; top: 0; bottom: 0; right: -2px; width: 2px; background: var(--c); }
    .deco-chemin.chem-s::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--c); }
    .ter-cell.deco-eau { --c: #8fc9e6; --h: -4px; box-shadow: inset 0 2px 4px rgba(13,43,34,.28);
      background-image: repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 11px); animation: terEau 3.2s linear infinite; }
    @keyframes terEau { to { background-position: 22px 22px; } }
    .tc-eol { position: relative; width: 5px; height: 24px; background: linear-gradient(180deg,#f2f6f1,#b9c7bd); border-radius: 2px; }
    .tc-eol b { position: absolute; left: 50%; top: -7px; width: 0; height: 0; }
    .tc-eol b::before { content: '✳'; position: absolute; left: -9px; top: -9px; font-size: 17px; line-height: 17px; color: #f7fbf6; text-shadow: 0 1px 2px rgba(13,43,34,.4); animation: terRotor 2.2s linear infinite; transform-origin: 50% 50%; }
    @keyframes terRotor { to { transform: rotate(360deg); } }
    .tc-ic { display: inline-block; transform: rotateZ(calc(-1*var(--rot,0deg))) rotateX(-54deg) scale(1.25); transform-origin: 50% 90%; pointer-events: none; filter: drop-shadow(0 2px 1.5px rgba(0,0,0,.3)); }
    /* étiquette flottante du nom de l'espace */
    .ter-label { position: absolute; left: 50%; top: 50%; white-space: nowrap;
      transform: translate(-50%,-50%) translateZ(30px) rotateZ(calc(-1*var(--rot,0deg))) rotateX(-54deg); transform-origin: 50% 50%;
      background: rgba(255,255,255,.94); color: var(--forest); font-size: .6rem; font-weight: 700; padding: 3px 8px; border-radius: 20px;
      box-shadow: 0 1.5px 3px rgba(13,43,34,.28), inset 0 0 0 1px rgba(13,43,34,.06); pointer-events: none; z-index: 4; }
    .ter-fly { position: absolute; font-size: 12px; pointer-events: none; z-index: 3; animation: terFlyA 26s linear infinite; }
    @keyframes terFlyA { 0% { left: -4%; top: 64%; } 22% { left: 24%; top: 36%; } 48% { left: 54%; top: 58%; } 74% { left: 78%; top: 32%; } 100% { left: 104%; top: 50%; } }
    .ter-dusk { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 2;
      background: linear-gradient(180deg,rgba(52,62,118,.6),rgba(255,140,60,.35)); mix-blend-mode: multiply; opacity: 0; animation: terDusk 150s linear infinite; }
    @keyframes terDusk { 0%,58% { opacity: 0; } 68%,82% { opacity: .3; } 92%,100% { opacity: 0; } }
    .ter-zoom { position: absolute; right: .55rem; top: .55rem; display: flex; gap: .3rem; z-index: 5; }
    .ter-zoom button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--moss); font-weight: 800; cursor: pointer; font-family: var(--font); font-size: 1rem; }
    .ter-zoom button:hover { border-color: var(--fern); }

    /* ─── Légende des espaces (cliquable) ─── */
    .ter-legend { margin-top: .9rem; display: flex; flex-direction: column; gap: .3rem; }
    .ter-leg { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem; width: 100%; border: 1.5px solid var(--line); background: #fff;
      border-radius: 10px; padding: .4rem .55rem; cursor: pointer; font-family: var(--font); font-size: .74rem; color: var(--ink); transition: border-color .12s, background .12s; }
    .ter-leg .tl-sol { flex-basis: 100%; font-size: .68rem; color: #a06c00; font-weight: 650; border-top: 1px dashed rgba(200,115,42,.3); padding-top: .3rem; margin-top: .1rem; }
    .ter-leg .tl-sol em { font-weight: 500; opacity: .8; }
    .ter-leg:hover { border-color: var(--fern); }
    .ter-leg.on { border-color: var(--forest); background: color-mix(in srgb, var(--fern) 12%, #fff); }
    .ter-leg .tl-sw { width: 13px; height: 13px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(20,67,46,.2); }
    .ter-leg .tl-nm { font-weight: 700; }
    .ter-leg .tl-n { margin-left: auto; color: var(--moss); font-variant-numeric: tabular-nums; }
    .ter-leg.none .tl-n { opacity: .5; }
    .ter-leg .tl-x { flex: none; color: var(--moss); opacity: .5; font-size: .8rem; padding: 0 .1rem; }
    .ter-leg .tl-x:hover { opacity: 1; color: #c0392b; }

    /* ─── Palette des espaces (sous le plateau) ─── */
    .palette { margin-top: 1rem; }
    .pal-hint { font-size: .74rem; color: var(--moss); background: var(--cream); border-radius: 10px; padding: .5rem .65rem; margin-bottom: .6rem; }
    .pal-sect { font-size: .68rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--moss); margin: .9rem 0 .45rem; display: flex; align-items: center; gap: .35rem; }
    .pal-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    /* cartes de décor (icône + libellé) */
    .deco-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .5rem; }
    .deco-card { display: flex; flex-direction: column; align-items: center; gap: .25rem; border: 1.5px solid var(--line); background: #fff;
      border-radius: 14px; padding: .7rem .3rem .55rem; cursor: pointer; font-family: var(--font); transition: border-color .12s, background .12s, transform .1s; }
    .deco-card:hover { border-color: var(--fern); }
    .deco-card:active { transform: scale(.97); }
    .deco-card.on { border-color: var(--forest); background: color-mix(in srgb, var(--fern) 13%, #fff); box-shadow: 0 3px 10px rgba(20,67,46,.12); }
    .deco-card .dc-ic { font-size: 1.5rem; line-height: 1; }
    .deco-card .dc-nm { font-size: .74rem; font-weight: 650; color: var(--forest); }
    .pal-chip { display: inline-flex; align-items: center; gap: .3rem; border: 1.5px solid var(--line); background: #fff; color: var(--forest);
      border-radius: 100px; padding: .4rem .7rem; font-family: var(--font); font-size: .76rem; font-weight: 650; cursor: pointer; transition: border-color .12s, transform .1s; }
    .pal-chip:hover { border-color: var(--fern); }
    .pal-chip:active { transform: scale(.96); }
    .pal-chip .pc-ic { font-size: .95rem; }
    /* Deva pointe (pull) : liseré d'accent doux qui respire */
    .pal-chip.suggested { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); animation: palPulse 1.8s ease-in-out infinite; }
    @keyframes palPulse { 0%,100% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 14%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); } }
    .pal-tools { display: flex; gap: .4rem; margin-top: .7rem; }
    .pal-tools button { flex: 1; border: 1.5px solid var(--line); background: #fff; color: var(--moss); border-radius: 10px; padding: .5rem; font-family: var(--font); font-size: .74rem; font-weight: 700; cursor: pointer; }
    .pal-tools button:hover { border-color: var(--fern); }
    .pal-tools button.on { border-color: var(--gold); background: #fff7e6; color: #a06c00; }

    /* ─── Fenêtre du Commun, ouverte SOUS l'esquisse ─── */
    .commun-drawer { margin-top: 1.1rem; border: 1.5px solid rgba(200,115,42,.4); border-radius: 18px; overflow: hidden;
      background: color-mix(in srgb, #fff7e6 55%, #fff); box-shadow: 0 10px 28px -18px rgba(160,108,0,.5); animation: drawerUp .3s ease both; }
    @keyframes drawerUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .cd-head { display: flex; align-items: center; gap: .55rem; padding: .7rem .9rem; background: color-mix(in srgb, var(--gold) 18%, #fff); border-bottom: 1px solid rgba(200,115,42,.25); }
    .cd-head .cd-ic { font-size: 1.3rem; }
    .cd-head .cd-title { font-weight: 800; color: #7a5200; font-size: .9rem; }
    .cd-head .cd-sub { font-size: .72rem; color: #a06c00; }
    .cd-head .cd-close { margin-left: auto; border: none; background: rgba(0,0,0,.06); color: #7a5200; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: .8rem; }
    .cd-head .cd-close:hover { background: rgba(0,0,0,.12); }
    .cd-cards { padding: .8rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .7rem; }

    /* ─── Carte de solution du Commun ─── */
    .sol-card { min-width: 0; background: var(--paper); border: 1px solid rgba(200,115,42,.35);
      border-left: 4px solid var(--gold); border-radius: 16px; padding: .8rem .9rem; box-shadow: 0 6px 18px -14px rgba(20,67,46,.4); }
    .sol-card.attached { border-color: var(--fern); border-left-color: var(--fern); background: color-mix(in srgb, var(--fern) 8%, #fff); }
    .sol-head { display: flex; align-items: flex-start; gap: .55rem; }
    .sol-head .sol-ic { font-size: 1.45rem; line-height: 1; flex: none; }
    .sol-titre { font-weight: 800; color: var(--forest); font-size: .98rem; }
    .sol-src { font-size: .7rem; color: #a06c00; margin-top: .12rem; }
    .sol-src em { font-style: italic; opacity: .85; }
    .sol-more { margin-top: .55rem; border: none; background: none; color: var(--moss); font-family: var(--font); font-size: .74rem; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }
    .sol-desc { margin-top: .45rem; font-size: .82rem; line-height: 1.45; color: var(--ink); background: var(--cream); border-radius: 10px; padding: .5rem .6rem; }
    .sol-attach { margin-top: .65rem; width: 100%; border: none; background: var(--gold); color: #3a2a00; font-family: var(--font);
      font-size: .84rem; font-weight: 800; border-radius: 12px; padding: .6rem; cursor: pointer; transition: filter .12s; }
    .sol-attach:hover { filter: brightness(.96); }
    .sol-card.attached .sol-attach { background: var(--fern); color: #fff; }

    /* petit message transitoire */
    #esq-toast { position: fixed; left: 50%; bottom: 1.4rem; transform: translate(-50%,16px); background: var(--forest); color: #fff;
      padding: .65rem 1.05rem; border-radius: 100px; font-size: .82rem; font-weight: 600; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
      transition: opacity .18s, transform .18s; z-index: 100; max-width: 90vw; text-align: center; }
    #esq-toast.show { opacity: 1; transform: translate(-50%,0); }

    /* ─── Repli mobile : Deva en bandeau haut, l'outil dessous ─── */
    @media (max-width: 720px) {
